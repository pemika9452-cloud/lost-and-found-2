<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        
        .item-list { margin-top: 20px; }
        .item-card { padding: 12px 0; border-bottom: 1px solid #eee; }
        .item-title { font-weight: bold; font-size: 16px; }
        .item-detail { color: #4b5563; font-size: 14px; margin-top: 4px; white-space: pre-wrap; }
        .item-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>ฟอร์มแจ้งของหาย / พบของ</h2>
    <form id="itemForm">
        <input type="text" id="title" placeholder="ชื่อสิ่งของ" required>
        <textarea id="detail" placeholder="รายละเอียด/สถานที่/ช่องทางติดต่อ" rows="4"></textarea>
        <label style="font-size: 14px; color: #555;">แนบรูปภาพ (ถ้ามี):</label>
        <input type="file" id="imageInput" accept="image/*">
        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>

    <div id="itemsContainer" class="item-list"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBaen_e_u-BHejjr2AdPjt5IAAZDTFVpmY",
        authDomain: "lost-and-found-e1aae.firebaseapp.com",
        projectId: "lost-and-found-e1aae",
        storageBucket: "lost-and-found-e1aae.firebasestorage.app",
        messagingSenderId: "98180766641",
        appId: "1:98180766641:web:f0648f3cbe34914a9d3b90",
        measurementId: "G-28YZP59306"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ฟังก์ชันแปลงไฟล์รูปเป็น Base64 String
      const convertBase64 = (file) => {
        return new Promise((resolve, reject) => {
          const fileReader = new FileReader();
          fileReader.readAsDataURL(file);
          fileReader.onload = () => resolve(fileReader.result);
          fileReader.onerror = (error) => reject(error);
        });
      };

      document.getElementById("itemForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        
        const title = document.getElementById("title").value;
        const detail = document.getElementById("detail").value;
        const fileInput = document.getElementById("imageInput");
        const file = fileInput.files[0];

        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังบันทึก...";

        try {
          let imageBase64 = "";
          if (file) {
            imageBase64 = await convertBase64(file);
          }

          await addDoc(collection(db, "items"), {
            title: title,
            detail: detail,
            image: imageBase64,
            createdAt: new Date().toISOString()
          });

          alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
          document.getElementById("itemForm").reset();
        } catch (error) {
          alert("เกิดข้อผิดพลาด: " + error.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "บันทึกข้อมูล";
        }
      });

      // ดึงข้อมูลแสดงผล Realtime
      onSnapshot(collection(db, "items"), (snapshot) => {
        const container = document.getElementById("itemsContainer");
        container.innerHTML = "";
        
        snapshot.forEach((doc) => {
          const item = doc.data();
          const imgTag = item.image ? `<img src="${item.image}" class="item-img" alt="รูปสิ่งของ">` : '';
          
          const itemHTML = `
            <div class="item-card">
                <div class="item-title">${item.title}</div>
                <div class="item-detail">${item.detail || '-'}</div>
                ${imgTag}
            </div>
          `;
          container.innerHTML += itemHTML;
        });
      });
    </script>
</body>
</html>
